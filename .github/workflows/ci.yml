name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call: {}

# Static website (GitHub Pages serves the repo directly — no build step). The
# real check (minimum-viable CI) is a syntax pass over every JavaScript source;
# HTML validation is advisory because the site intentionally carries
# legacy-era markup (IE5/Lynx compatibility is a feature).

# Force JavaScript-based actions to run on Node 24 instead of the deprecated
# Node 20 ahead of the 2026-06-16 hard cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax-check every JavaScript source
        run: |
          status=0
          count=0
          while IFS= read -r -d '' f; do
            count=$((count + 1))
            if ! node --check "$f" 2>err.log; then
              echo "::error file=$f::JavaScript syntax check failed"
              cat err.log
              status=1
            fi
          done < <(find . -path ./.git -prune -o -name '*.js' -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::no .js files found — nothing was checked"
            exit 1
          fi
          echo "$count file(s) syntax-checked."
          exit $status

      # The desktop's app versions (sz/Applications/versions.js) are generated
      # from the history; main regenerates them after every push (see
      # publish-versions), so here it only has to run cleanly.
      - name: Generate the desktop app versions
        run: bash sz/update-versions.sh

      # Advisory: the site deliberately serves legacy markup (IE5/Lynx-era
      # fallbacks), which modern validators flag — never block on it.
      - name: Validate HTML
        continue-on-error: true
        run: npx --yes html-validate "**/*.html" || true

  # The Cipher tests, in two runners that each fail the build on any failure.
  # (The job keeps its original id so the publish-docs wiring and any required
  # check names stay as they were.)
  round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Every category of every algorithm, each file loaded once:
      # - the committed vectors, metadata, OpCodes use and type budgets per file
      # - ROUNDTRIP: an adversarial corpus through every reversible algorithm. An
      #   algorithm can pass every committed vector and still fail to decode its
      #   own output on inputs nobody wrote down. The interoperability results
      #   are printed alongside but do not gate: several algorithms deliberately
      #   do not claim bitstream compatibility with the format they are named after.
      # - CHUNKED: Feed(whole) must equal Feed(part1); Feed(part2); ... Every
      #   committed vector delivers its message in a single call, so 103
      #   algorithms that mishandled buffering across calls passed everything.
      # - BROWSER: every script tag of index.html evaluated in page order with no
      #   require, module or global; twenty files once threw there while passing
      #   everything else.
      # - LIBRARY: the OpCodes helper and ByteBuffer unit tests.
      - name: Test every algorithm (vectors, round trips, chunked feeds, browser load, libraries)
        working-directory: Cipher
        run: node tests/TestSuite.js

      # The CSHARP category compiles and runs the generated C# runtime stubs,
      # which target net10.0.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Code generation for every language, type inference, the type policy, the
      # OpCodes/framework JSDoc audit and the C# regressions - a few seconds.
      # VALIDATION (transpile, compile and run every algorithm in every installed
      # language) is not run here: it takes over ten minutes unscoped and its
      # result depends on which toolchains the runner happens to carry. Run it
      # locally with: node tests/TranspilerSuite.js --only=validation
      - name: Test the transpiler
        working-directory: Cipher
        run: node tests/TranspilerSuite.js

  # The algorithm reference (Cipher/docs/algorithms/) is derived entirely from the
  # implementations. It is committed because GitHub Pages serves main as-is, and
  # the publish-docs job below keeps it current; this job only proves it builds.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The category READMEs list which algorithms exist. Maintained by hand they
      # drifted badly - the compression list named 24 implemented against 127
      # registered, and 28 entries across two files were listed as missing after
      # being implemented. The generated sections and the hand-written
      # not-yet-implemented lists are both checked here so that cannot recur.
      - name: Check the category READMEs against the registry
        working-directory: Cipher
        run: node tools/refresh-readmes.js --check

      # index.html loads each algorithm with its own script tag. The Node suites
      # walk the directories instead, so a file added without a tag passes every
      # test and is simply missing in the browser - that had reached 250 of 933.
      - name: Check the browser script tags against the algorithm directories
        working-directory: Cipher
        run: node tools/refresh-index-scripts.js --check

      # Fails the build when the reference cannot be generated at all (a file
      # that does not load, an algorithm no source file can be attributed to):
      # that would break publishing on main.
      - name: Build the algorithm reference
        working-directory: Cipher
        run: node tools/generate-algorithm-docs.js

      # Stale committed pages in a pull request are reported, not failed. main
      # regenerates and commits the tree after every green push, so a stale page
      # never outlives the merge, and requiring every PR that touches metadata to
      # carry regenerated pages would make parallel PRs conflict on generated
      # files (the index lists counts). The warning still shows which pages the
      # change will move, which is what a reviewer wants from the check.
      - name: Report committed pages the change makes stale
        if: github.event_name == 'pull_request'
        run: |
          stale=$(git status --porcelain -- Cipher/docs/algorithms)
          if [ -z "$stale" ]; then
            echo "The committed algorithm reference matches the sources."
            exit 0
          fi
          echo "::warning::$(printf '%s\n' "$stale" | wc -l) algorithm reference page(s) differ from the sources; main regenerates them on merge (or run: node Cipher/tools/generate-algorithm-docs.js)"
          printf '%s\n' "$stale" | head -50

  # Regenerates the algorithm reference and commits it back to main, so the
  # published pages always follow the sources. How this is kept safe:
  # - Runs only for a push to main in this repository: the `if` excludes
  #   pull_request (and a workflow_call from anywhere else), so a PR can never
  #   write to main and never gets a write token.
  # - Runs only after every test job passed (`needs`), so code that fails its
  #   vectors never regenerates the reference.
  # - Cannot loop: a push made with the workflow's GITHUB_TOKEN does not trigger
  #   new workflow runs (GitHub suppresses events caused by GITHUB_TOKEN, apart
  #   from workflow_dispatch and repository_dispatch), so the commit below
  #   starts no CI run. Even if it did, that run would regenerate an identical
  #   tree and stop at "nothing changed".
  # - Commits nothing when the regenerated tree equals the committed one.
  # - Races: `concurrency` queues the publish jobs one at a time. The commit is
  #   made through GitHub's API only while main still points at the tested
  #   commit; if main moved on, the job stops cleanly: the newer push has its
  #   own run, which regenerates from the newer, tested sources.
  # - Signed: commits made through the API are signed by GitHub, so the
  #   generated commits show as verified like every other commit on main.
  # - contents: write is granted to this job only; every other job keeps the
  #   repository's read-only default.
  publish-docs:
    name: publish algorithm reference
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Hawkynt/Hawkynt.github.io'
    needs: [check, round-trip, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-algorithm-reference
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate the algorithm reference
        working-directory: Cipher
        run: node tools/generate-algorithm-docs.js

      - name: Commit and push the reference if it changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- Cipher/docs/algorithms)" ]; then
            echo "The committed algorithm reference already matches the sources."
            exit 0
          fi
          # committed through GitHub's API, which signs the commit (verified)
          rc=0
          node .github/scripts/commit-changes.js '* the algorithm reference follows the sources' Cipher/docs/algorithms || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::main moved past $GITHUB_SHA; the run for the newer push regenerates the reference."
            exit 0
          fi
          exit $rc

  # Regenerates the desktop's app versions (sz/Applications/versions.js) and
  # commits them back to main. The desktop appends an app's version to the
  # address it loads the app from, so a changed app is fetched anew instead of
  # coming from the browser cache. Kept safe the same way as publish-docs:
  # pushes to main of this repository only, after the checks passed, no loop
  # (GITHUB_TOKEN pushes start no runs), nothing committed when nothing changed.
  # It has a queue of its own (a shared one would let it cancel a pending
  # publish-docs); when another push landed first, the newer push's run
  # publishes the versions instead.
  publish-versions:
    name: publish desktop app versions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Hawkynt/Hawkynt.github.io'
    needs: [check]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-desktop-versions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Regenerate the app versions
        run: bash sz/update-versions.sh

      - name: Commit and push the versions if they changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- sz/Applications/versions.js)" ]; then
            echo "The committed app versions already match the history."
            exit 0
          fi
          # committed through GitHub's API, which signs the commit (verified)
          rc=0
          node .github/scripts/commit-changes.js '* the desktop app versions follow the history' sz/Applications/versions.js || rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::notice::main moved past $GITHUB_SHA; the run for the newer push publishes the versions."
            exit 0
          fi
          exit $rc

  # A text lint over README.md against the house convention — no build, no toolchain — so it
  # runs beside the rest rather than inside it and cannot mask them.
  repo-readme:
    name: repo README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Hawkynt/RepositoryTemplate/repo-readme@v1
